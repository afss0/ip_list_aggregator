name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: make test

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Lint (bash -n + shellcheck)
        run: make lint

      - name: Applier scenarios (stubbed ipset/iptables)
        run: make scenarios

  integration:
    name: Kernel-level apply (container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply and verify with real ipset/iptables
        run: make integration
