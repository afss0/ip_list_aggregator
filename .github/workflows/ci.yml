name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Shell syntax
        run: |
          bash -n update_firewall_blocklist.sh
          bash -n tests/scenarios.sh
          bash -n tests/integration.sh

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning update_firewall_blocklist.sh tests/scenarios.sh tests/integration.sh

      - name: Applier scenarios (stubbed ipset/iptables)
        run: bash tests/scenarios.sh

  integration:
    name: Kernel-level apply (container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build -t ip_list_aggregator:test -f tests/Dockerfile .

      - name: Apply and verify with real ipset/iptables
        run: |
          docker run --rm --privileged \
            -v "${PWD}:/repo:ro" \
            ip_list_aggregator:test \
            bash /repo/tests/integration.sh
